<style>
:root{--p:#9b1c4b;--bg:#faf6f8;--b:#e3d5dc}

table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid var(--b);padding:5px 7px;text-align:left}th{background:#f3e6ec}td input{width:100%}.r{text-align:right}.low{background:#ffe3e3}

}

let RC='',RN='';
const unitNet=(b,l)=>(+l.r||0)*(1-(b.s?(+b.d||0)/b.s:0))*(1+(+l.g||0)/100);
const retDone=(no,it)=>D.ret.filter(r=>r.no==no&&r.it==it).reduce((a,r)=>a+(+r.q||0),0);
window.retCust=v=>{RC=v.trim();const b=D.bills.find(x=>x.no==RN);if(b&&b.c!=RC)RN='';go()};
window.retBill=v=>{RN=v.trim();const b=D.bills.find(x=>x.no==RN);if(b)RC=b.c;go()};
window.retAmt=i=>{const b=D.bills.find(x=>x.no==RN);if(!b)return;const l=b.L[i],q=+$('rq'+i).value||0;$('ra'+i).value=Math.round(q*unitNet(b,l))};
window.retDo=i=>{const b=D.bills.find(x=>x.no==RN);if(!b)return;const l=b.L[i],q=+$('rq'+i).value||0,a=+$('ra'+i).value||0,mx=l.q-retDone(b.no,l.n);
  if(q<=0)return alert('નંગ લખો');if(q>mx)return alert('આ બિલમાં આ સાડી વધુમાં વધુ '+mx+' નંગ પાછી આવી શકે');
  const r={dt:$('rdt').value||td(),c:b.c,no:b.no,it:l.n,q,a,cr:0};
  const it=D.items.find(x=>x.n==l.n);if(it)it.q+=q;
  if(b.bal>0){r.cr=Math.min(a,b.bal);b.bal-=r.cr;b.rec+=r.cr}
  D.ret.push(r);save();go();

<script>
/* ===== 1. બિલ યાદી ફિલ્ટર ===== */
let BFL='all',BDF='',BDT2='',BSM='';
const _pm=b=>[b.pm,b.pm2].filter(Boolean).join(' ');
const bFlt={all:()=>true,pend:b=>b.bal>0,cash:b=>/રોકડ|cash/i.test(_pm(b)),upi:b=>/UPI|બેંક|gpay|phonepe/i.test(_pm(b)),card:b=>/કાર્ડ|card/i.test(_pm(b)),cr:b=>/ઉધાર/.test(_pm(b)),today:b=>b.dt==td(),gst:b=>b.ty=='ટેક્સ બિલ'};
const bfBar=()=>[['all','📋 બધા'],['pend','⏳ બાકી'],['cash','💵 કેશ'],['upi','📱 UPI'],['card','💳 કાર્ડ'],['cr','📒 ઉધાર'],['today','📅 આજના'],['gst','🧾 ટેક્સ બિલ']].map(([k,l])=>`<button class="s ${BFL==k?'on':''}" onclick="BFL='${k}';BL=200;bfGo()">${l} <span class="pgb">${D.bills.filter(bFlt[k]).length}</span></button>`).join('');
function btab2(){const q=BQ.toLowerCase(),f=bFlt[BFL]||bFlt.all,A=[];for(let i=D.bills.length-1;i>=0;i--){const b=D.bills[i];if(!f(b)||(BDF&&b.dt<BDF)||(BDT2&&b.dt>BDT2))continue;if(q&&!(b.no+' '+b.dt+' '+b.c+' '+(b.mo||'')).toLowerCase().includes(q))continue;A.push(b)}
const S=(k)=>A.reduce((s,b)=>s+(+b[k]||0),0);BSM=`<b>${A.length}</b> બિલ · કુલ <b>₹ ${fmt(S('tot'))}</b> · જમા <b>₹ ${fmt(S('rec'))}</b> · બાકી <b style="color:#c0392b">₹ ${fmt(S('bal'))}</b>`;
return `<tr><th>બિલ નં<th>તારીખ<th>ગ્રાહક<th class="r">કુલ<th class="r">જમા<th class="r">બાકી<th>રીત<th></tr>`+A.slice(0,BL).map(b=>brow(b).replace('<td><button class="s" onclick="pr(\'','<td>'+(_pm(b)||'')+'<td><button class="s" onclick="pr(\'')).join('')+(A.length>BL?'<tr><td colspan="8">… વધુ બિલ છે – "વધુ બતાવો" દબાવો':'')}
function bfGo(){const t=btab2();$('bl').innerHTML=t;$('bfb').innerHTML=bfBar();$('bsm').innerHTML=BSM;if(typeof trDom=='function')trDom($('bl'))}
function bsrch2(v){BQ=v;BL=200;clearTimeout(BT);BT=setTimeout(bfGo,200)}
VW.bills=()=>{const t=btab2();return `<h3>બિલ યાદી (${D.bills.length})</h3><div class="fch" id="bfb">${bfBar()}</div><div class="fbar"><input placeholder="🔍 બિલ / ગ્રાહક / મોબાઈલ" value="${BQ}" oninput="bsrch2(this.value)" size="28"><label>થી</label><input type="date" value="${BDF}" onchange="BDF=this.value;bfGo()"><label>સુધી</label><input type="date" value="${BDT2}" onchange="BDT2=this.value;bfGo()"><button class="s" onclick="BFL='all';BQ='';BDF='';BDT2='';go()">✖ ફિલ્ટર સાફ</button><button class="s" onclick="BL+=200;bfGo()">વધુ બતાવો</button></div><div class="card" id="bsm" style="padding:10px 14px">${BSM}</div><table id="bl">${t}</table>`};
/* ===== 2. ઓર્ડર: સ્ટોકમાંથી સાડી પસંદ / મેન્યુઅલ ===== */
{const o=VW.ord;VW.ord=function(){let h=o.apply(this,arguments);
h=h.replace('<div><label>સાડી / વિગત</label><input id="or_v" size="26"></div>',`<div><label>સાડી / વિગત (સ્ટોકમાંથી પસંદ કરો અથવા જાતે લખો)</label><input id="or_v" size="30" list="orl" autocomplete="off" onchange="orPick(0)" oninput="orPick(1)"><small id="orh" style="display:block;min-height:14px;color:var(--mut)"></small></div><div><label>નંગ</label><input id="or_q" type="number" value="1" min="1" style="width:70px" oninput="orPick(2)"></div>`).replace('<input id="or_t" type="number">','<input id="or_t" type="number" oninput="this.dataset.auto=\'\'">');
return h+`<datalist id="orl">${D.items.map(i=>`<option value="${String(i.n).replace(/"/g,'&quot;')}">${i.c||''} · ₹${i.r} · સ્ટોક ${i.q}</option>`).join('')}</datalist>`}}
function orPick(m){const v=$('or_v').value.trim(),it=D.items.find(i=>i.n==v||(i.c&&i.c==v)),q=+$('or_q').value||1,h=$('orh'),t=$('or_t');if(!it){h.textContent=v?'✍ મેન્યુઅલ એન્ટ્રી':'';return}
if(m==0&&it.c&&v==it.c)$('or_v').value=it.n;h.textContent=`✔ સ્ટોકમાં ${it.q} નંગ · ભાવ ₹${it.r}`+(it.q<q?' ⚠ સ્ટોક ઓછો':'');if(m!=2||t.dataset.auto=='1'){if(m==2||!t.value||t.dataset.auto=='1'){t.value=it.r*q;t.dataset.auto='1'}}}
{const _os=osave;osave=function(){const q=+(($('or_q')||{}).value)||1,v=$('or_v');if(q>1&&v&&!/×/.test(v.value))v.value=v.value.trim()+' × '+q;_os()}}
/* ===== 3. હપ્તા: બાકી ગ્રાહક યાદી → ક્લિક કરતાં વિગત ===== */
let INF='pend',INQ='',INO={},INL=[];
const insDone=i=>i.pd>=i.a||((D.bills.find(b=>b.no==i.no)||{bal:0}).bal<=0);
function insGrp(){const t=td(),m={};D.ins.forEach((i,x)=>{(m[i.c]=m[i.c]||{c:i.c,L:[]}).L.push([i,x])});
return Object.values(m).map(g=>{const op=g.L.filter(([i])=>!insDone(i)),od=op.filter(([i])=>i.dt<=t);return{...g,op,od,pend:op.reduce((s,[i])=>s+i.a-i.pd,0),nx:op.map(([i])=>i.dt).sort()[0]||''}}).sort((a,b)=>b.od.length-a.od.length||b.pend-a.pend)}
const insBar=()=>{const G=insGrp();return [['pend','⏳ બાકી ગ્રાહક',G.filter(g=>g.op.length).length],['od','⏰ મોડા',G.filter(g=>g.od.length).length],['all','📋 બધા ગ્રાહક',G.length]].map(([k,l,n])=>`<button class="s ${INF==k?'on':''}" onclick="INF='${k}';insGo()">${l} <span class="pgb">${n}</span></button>`).join('')};
function insList(){const t=td(),q=INQ.toLowerCase();INL=insGrp().filter(g=>(INF=='all'||(INF=='od'?g.od.length:g.op.length))&&(!q||g.c.toLowerCase().includes(q)));
return INL.map((g,k)=>{const c=D.cu.find(x=>x.n==g.c)||{},op=INO[g.c],pb=D.bills.filter(b=>b.c==g.c&&b.bal>0);
const det=op?`<div class="icb"><b>📄 બાકી બિલ</b>${tbl2(['બિલ','તારીખ','કુલ','બાકી',''],pb.map(b=>[b.no,b.dt,fmt(b.tot),fmt(b.bal),`<button class="s" onclick="rcv('${b.no}')">જમા</button> ${D.ins.some(i=>i.no==b.no)?'':`<button class="s" onclick="mkins('${b.no}')">📅 પ્લાન</button> `}${c.mo?`<button class="s" onclick="wa('${b.no}')">💬</button>`:''}`]))||''}<b>📅 હપ્તા</b>${tbl2(['તારીખ','બિલ','હપ્તો','રકમ','ભર્યા','સ્થિતિ',''],g.L.sort((a,b)=>a[0].dt<b[0].dt?-1:1).map(([i,x])=>{const d=insDone(i);return[i.dt,i.no,i.k+'/'+i.n,fmt(i.a),fmt(i.pd),d?'✅ પૂરું':i.dt<=t?'⏰ મોડું':'આવનાર',(d?'':`<button class="s" onclick="ipay(${x})">💰 જમા</button> <button class="s" onclick="wi(${x})">💬</button> `)+`<button class="s" onclick="idel(${x})">🗑</button>`]}))}</div>`:'';
return `<div class="icd ${op?'open':''}"><div class="ich" onclick="insTog(${k})"><span class="icn">${op?'▾':'▸'} <b>${g.c}</b> <small>${c.mo||''}</small></span><span class="icp">${g.od.length?`<span class="pgb" style="background:#c0392b">⏰ ${g.od.length} મોડા</span>`:''} ${g.nx?`<small>આગળનો: ${g.nx}</small>`:''} <b class="${g.pend>0?'r':''}">બાકી ₹ ${fmt(g.pend)}</b></span></div>${det}</div>`}).join('')||'<div class="card">કોઈ ગ્રાહક નથી ✅</div>'}
function tbl2(h,r){return r.length?`<table><tr>${h.map(x=>'<th>'+x).join('')}</tr>${r.map(x=>'<tr>'+x.map(c=>'<td>'+c).join('')+'</tr>').join('')}</table>`:''}
function insTog(k){const g=INL[k];if(g){INO[g.c]=!INO[g.c];insGo()}}
function insGo(){$('inl').innerHTML=insList();$('inb').innerHTML=insBar()}
{const o=VW.ins;VW.ins=function(){const base=o.apply(this,arguments).split('<br><small>')[0];return base+`<div class="fch" id="inb">${insBar()}</div><div class="fbar"><input placeholder="🔍 ગ્રાહક શોધ" value="${INQ}" oninput="INQ=this.value;insGo()" size="26"></div><small>ગ્રાહક પર ક્લિક કરતાં તેના બાકી બિલ અને હપ્તાની વિગત ખૂલશે. બાકી બિલ સામે 📅 પ્લાનથી નવો હપ્તા પ્લાન બને છે.</small><div id="inl">${insList()}</div>`}}
</script>

body.mob #mn table.mt{display:block;border:0;background:none;box-shadow:none;white-space:normal;overflow:visible}

body.mob #mn table.mt td:last-child:has(button){grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:6px;padding-top:4px!important}
body.mob #mn table.mt td:last-child:has(button)::before{display:none}
body.mob #mn table.mt tr.low{border-left:4px solid #e03e52}
body.mob #mn table:not(.mt){display:block;overflow-x:auto;white-space:nowrap;max-width:100%;border-radius:14px;background:var(--surf)}
/* હીરો */
.mhero{background:linear-gradient(135deg,#a8175a,#6f1d7a 60%,#3f2b96);color:#fff;border-radius:22px;padding:16px;margin:6px 0 4px;box-shadow:0 14px 30px #6f1d7a55}
.mhero small{opacity:.85}.mhero .mh1{font-size:27px;font-weight:800;margin:2px 0 10px}
.mhero .mhs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mhero .mhs div{background:#ffffff24;border-radius:14px;padding:8px 10px;font-size:11.5px}.mhero .mhs b{display:block;font-size:15px;margin-top:2px}
/* POS */
#pos{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.pc{background:var(--surf);border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 4px 16px #0000000d}.pc .pt{font-weight:800;margin-bottom:6px}
.pr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pres{max-height:260px;overflow:auto}.prs{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}.prs small{color:var(--mut)}
.pci{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--surf);border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:0 3px 12px #0000000d}
.pci .pn{font-weight:700}.pci .pq{display:flex;align-items:center;gap:8px}.pci .pq button{width:34px;height:34px;border-radius:50%;border:0;background:#a8175a1f;color:#a8175a;font-size:20px;font-weight:800}.pci .pq b{min-width:22px;text-align:center}
.pci .pl{font-weight:800;color:#a8175a;text-align:right}.pci .px{border:0;background:none;color:#e03e52;font-size:16px}
.pci input.prt{width:90px;padding:6px 8px;border-radius:10px}.pemp{text-align:center;padding:26px 10px;color:var(--mut)}
.psm div.prw{display:flex;justify-content:space-between;padding:5px 2px;font-size:14px}.psm .pwn{color:#c0392b;font-size:13px}
#pbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:7;background:var(--surf);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px #0002;padding:10px 14px;display:flex;align-items:center;gap:10px}
#pbar .tt{flex:1;line-height:1.2}#pbar .tt b{font-size:22px;color:#a8175a}#pbar .tt small{color:var(--mut)}#pbar .b{padding:13px 20px}
#ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-70px);z-index:60;background:#fff;color:#a8175a;border-radius:20px;padding:8px 16px;font-weight:700;box-shadow:0 8px 20px #0003;transition:transform .15s}
#tst{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;border-radius:22px;padding:10px 18px;z-index:120;font-size:14px;max-width:90%}
}

<script>

(function(){if(matchMedia('(min-width:901px)').matches)return;

function mobTb(){document.querySelectorAll('#mn table').forEach(t=>{if(t.dataset.mt||t.closest('#obw,#o,#pos'))return;t.dataset.mt=1;const rows=[...t.rows],hr=rows.find(r=>r.querySelector('th'));if(!hr||hr.cells.length<3)return;const H=[...hr.cells].map(c=>c.textContent.trim());rows.forEach(r=>{if(r===hr||r.cells.length!=H.length)return;[...r.cells].forEach((c,i)=>c.dataset.l=H[i])});t.classList.add('mt')})}
/* ----- POS બિલ ----- */
const rows=()=>[...document.querySelectorAll('#bt tr')].map((r,i)=>({r,i,n:r.querySelector('.n').value.trim(),q:+r.querySelector('.q').value||0,rt:+r.querySelector('.r2').value||0,g:+r.querySelector('.g2').value||0,ro:r.querySelector('.r2').readOnly})).filter(x=>x.n&&x.q>0);
{const ob=VW.bill;VW.bill=function(){const h=ob.apply(this,arguments);return`<div id="pos"><div class="pc"><div class="pt">🧾 બિલ પ્રકાર</div><div class="pch" id="pty"></div></div>
<div class="pc"><div class="pt">👤 ગ્રાહક</div><input id="pcn" list="cl" placeholder="ગ્રાહકનું નામ (ખાલી = રોકડ ગ્રાહક)" onchange="posC(1)" oninput="posC()"><div class="pr2" style="margin-top:8px"><input id="pmo" type="tel" placeholder="મોબાઈલ" oninput="posC()"><input id="pct" placeholder="શહેર / ગામ" oninput="posC()"></div><div id="pcb" style="margin-top:6px"></div></div>

<div id="pwarn" class="pwn" style="color:#c0392b;font-size:13px;margin:4px 4px"></div><div id="pcart"></div>
<div class="pc psm"><div class="pt">💰 હિસાબ</div><div class="pr2"><div><label>ડિસ્કાઉન્ટ ₹</label><input id="pdis" type="number" placeholder="ઑટો" oninput="posI('dis',this.value)"></div><div><label>પેકિંગ ₹</label><input id="ppk" type="number" oninput="posI('pk',this.value)"></div><div><label>જમા ₹ (ખાલી = પૂરા)</label><input id="prc" type="number" oninput="posI('rc',this.value)"></div><div><label>તારીખ</label><input id="pdt" type="date" onchange="posI('dt',this.value)"></div></div><div class="pt" style="margin-top:10px">ચુકવણી રીત</div><div class="pch" id="ppm"></div><div id="psmv"></div></div></div>

function posInit(){if(!g('pos')||!g('ty'))return;const S=(a,b)=>{if(g(a)&&g(b))g(a).value=g(b).value};S('pcn','cn');S('pmo','mo');S('pct','ct');S('pdis','dis');S('ppk','pk');S('prc','rc');S('pdt','dt');
const ch=(id,sel)=>{g(id).innerHTML=[...g(sel).options].map(o=>`<button class="${g(sel).value==o.value?'on':''}" onclick="posSel('${sel}',this)" data-v="${o.value}">${o.text||o.value}</button>`).join('')};ch('pty','ty');ch('ppm','pm');posRender()}

window.posF=q=>{const k=q.toLowerCase().trim(),R=g('pres');if(!k){R.innerHTML='';return}const L=D.items.filter(i=>(i.n+' '+(i.c||'')).toLowerCase().includes(k)).slice(0,8);R.innerHTML=L.map(i=>`<div class="prs" onclick="posAdd(${D.items.indexOf(i)})"><div><b>${i.n}</b><br><small>${i.c||''} · સ્ટોક ${i.q}</small></div><b>₹ ${fmt(i.r)}</b></div>`).join('')||'<div class="pemp">કોઈ સાડી મળી નહીં</div>'};

window.posMan=()=>{const n=prompt('સાડી / વિગત');if(!n)return;const q=+prompt('નંગ','1')||1,rt=+prompt('ભાવ ₹','')||0,gs=+prompt('GST %','0')||0;let r=[...g('bt').rows].find(x=>!x.querySelector('.n').value.trim())||addRow();r.querySelector('.n').value=n;r.querySelector('.q').value=q;r.querySelector('.r2').value=rt;r.querySelector('.g2').value=gs;calc()};

{const c0=calc;calc=function(){c0.apply(this,arguments);posRender()}}
